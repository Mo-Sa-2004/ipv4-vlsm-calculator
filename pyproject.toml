[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["subnet_calculator"]

[project]
name = "ipv4-vlsm-calculator"
version = "0.2.0"
description = "A VLSM (Variable Length Subnet Mask) calculator for IPv4 networks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Mohammed Saeed" }]
dependencies = ["pandas>=2.0", "tabulate>=0.9"]

[project.scripts]
vlsm-calc = "subnet_calculator:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["subnet_calculator.py", "test_subnet_calculator.py", "test_cli.py"]
